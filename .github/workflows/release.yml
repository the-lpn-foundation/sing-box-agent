name: Release

# Source-only release.
#
# sing-box is GPLv3. This repository is MIT licensed, so we intentionally do
# NOT publish pre-built binaries from this workflow — a compiled binary that
# statically links sing-box would be a GPLv3 derived work and incompatible
# with the project's MIT license. Users build from source themselves.
#
# GitHub automatically attaches source tarballs (zip/tar.gz) to every tag.
# This workflow only generates and attaches release notes.

on:
  release:
    types:
      - created

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Generate release notes
        run: |
          set -euo pipefail
          chmod +x scripts/release-notes.sh
          scripts/release-notes.sh "${{ github.event.release.tag_name }}" > release-notes.md

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ github.event.release.tag_name }}" --notes-file release-notes.md
