name: Release

on:
  release:
    types:
      - created

permissions:
  contents: read

env:
  GO_VERSION_FILE: go.mod

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Build deterministic release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          export CGO_ENABLED=0
          export GOFLAGS="-trimpath"
          artifact="sing-box-agent-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -buildvcs=false \
            -ldflags "-s -w -buildid= -X main.Version=${{ github.ref_name }} -X main.BuildTime=${{ github.event.head_commit.timestamp || github.event.release.published_at }} -X main.GitCommit=${{ github.sha }}" \
            -o "dist/${artifact}" \
            ./cmd/agent
          tar -C dist -czf "dist/${artifact}.tar.gz" "${artifact}"
          rm "dist/${artifact}"
          sha256sum "dist/${artifact}.tar.gz" > "dist/${artifact}.sha256"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/sing-box-agent-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            dist/sing-box-agent-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    outputs:
      slsa-subjects: ${{ steps.hashes.outputs.subjects }}
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate checksums file
        run: |
          set -euo pipefail
          cat dist/*.sha256 | sort > dist/checksums.txt

      - name: Prepare SLSA subjects
        id: hashes
        run: |
          set -euo pipefail
          echo "subjects=$(sha256sum dist/sing-box-agent-*.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-artifacts
          path: |
            dist/sing-box-agent-*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

  sbom:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-artifacts
          path: dist

      - name: Generate SBOM
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-sbom
          path: dist/sbom.spdx.json
          if-no-files-found: error

  provenance:
    needs: package
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects: ${{ needs.package.outputs.slsa-subjects }}
      upload-assets: true

  sign:
    runs-on: ubuntu-latest
    needs:
      - package
      - sbom
      - provenance
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-artifacts
          path: dist

      - name: Download SBOM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-sbom
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad

      - name: Sign release artifacts
        run: |
          set -euo pipefail
          for file in dist/sing-box-agent-*.tar.gz dist/checksums.txt dist/sbom.spdx.json; do
            cosign sign-blob --yes --bundle "${file}.bundle" "${file}"
          done

      - name: Generate release notes
        run: |
          set -euo pipefail
          chmod +x scripts/release-notes.sh
          scripts/release-notes.sh "${{ github.event.release.tag_name }}" dist/checksums.txt > dist/release-notes.md

      - name: Upload signed assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/sing-box-agent-*.tar.gz \
            dist/checksums.txt \
            dist/sbom.spdx.json \
            dist/sing-box-agent-*.tar.gz.bundle \
            dist/checksums.txt.bundle \
            dist/sbom.spdx.json.bundle \
            dist/release-notes.md \
            --clobber

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ github.event.release.tag_name }}" --notes-file dist/release-notes.md
