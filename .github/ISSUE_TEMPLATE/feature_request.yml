name: Feature request
description: Suggest a new capability or behavior change
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational pain are you trying to solve? Be concrete about the scenario.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch the desired behavior (API change, new config field, new endpoint, etc.).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Things you already tried or ruled out.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: "This feature fits the project's scope (agent-local management of a single sing-box; not a web UI, not a database)."
          required: true
