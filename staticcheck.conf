# staticcheck configuration for sing-box-agent
# See: https://staticcheck.dev/docs/checks

# Enable checks explicitly (we rely on default enabled set plus these)
checks = [
  "all",
]

# Exclude generated code or vendor directories if present
exclude = [
  "^generated/",
  "^vendor/",
]

# NOTE: We intentionally keep checks set to 'all' for staticcheck because
# staticcheck historically groups and exposes actionable checks; the project
# filters/ignores are handled via 'exclude' patterns above and the Makefile
# ensures the tool is pinned. Review before changing.
