version: "2"
linters:
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - io.Writer.Write
        - io.StringWriter.WriteString
        - (*github.com/gin-gonic/gin.Context).String
        - (*github.com/gin-gonic/gin.Context).JSON
        - (*github.com/gin-gonic/gin.Context).Data
        - io.Closer.Close
        - (*testing.T).Fatal
        - (*testing.T).Fatalf
        - (*testing.T).Error
        - (*testing.T).Errorf
        - (*log/slog.Logger).LogAttrs
        - (*log/slog.Logger).Debug
        - (*log/slog.Logger).Info
        - (*log/slog.Logger).Warn
        - (*log/slog.Logger).Error
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/the-lpn-foundation/sing-box-agent
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
